<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="./styles/fonts.css">
</head>
<body onload="init()">
 <header>
    <h1>The Pokédex</h1>
    <nav class="navi">
        <input id="input" type="search" placeholder="...">
    </nav>
 </header>
 <main>
    <div id="main_div">
        <div id="pokemonList"></div>
    </div>
    <dialog id="cardDialog" onclick="closeDialog()">
        <div id="dialogContentBox"></div>
            <div id="buttonsDiv" onclick="bubblingPrevention(event)">
            </div>
                <div id="infoCard">
                </div>
                    <div id="progressCard" style="display: none;">
                    </div>
                        <div id="evoCard" style="display: none;">
                        </div>
        </div>
    </dialog>
 </main>
</body>
</html>
