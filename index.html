<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <script src="script.js" defer></script>
    <script src="template.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="icon" type="imgage/png" href="./img/pokeLogo.png">
</head>
<body onload="init()">
 <header>
    <button id="homeBtn" onclick="refreshSite()"><img id="headerLogo" src="./img/pokeLogo.png"></button>
    <h1>The Pokédex</h1>
    <search>
        <form action="./search/" method="dialog">
                <input type="search" id="pokemonText" placeholder=" search for a Pokémon "/>
                <button onclick="showInput()" id="searchBtn">search</button>
        </form>
    </search>
 </header>
 <main data-id="content">
    <div id="main_div">
        <div id="pokemonList" style="display: none;"></div>
    </div>
    <div id="loader" style="display: flex";></div>
    <div id="loadBtnDiv">
            <button data-id="load-more-button" id="loadBtn" onclick="loadMore()">Load More</button>
    </div>
    
    <dialog data-id="dialog" id="cardDialog">
        <div data-id="overlay-pokemon-name" id="dialogContentBox"></div>
            <div id="buttonsDiv" onclick="bubblingPrevention(event)">
            </div>
                <div id="infoCard">
                </div>
                    <div id="progressCard" style="display: none;">
                    </div>
                        <div id="evoCard" style="display: none;">
                        </div>
            <div id="slideButtons" onclick="bubblingPrevention(event)"></div>
        </div>
    </dialog>
    <dialog id="errorDialog">
        <div id="errorContentBox">
        
        </div>
    </dialog>

 </main>
</body>
</html>
